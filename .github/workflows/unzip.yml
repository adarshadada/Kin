name: unzip
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip kin-source.zip into the repo root
        run: |
          unzip -q kin-source.zip -d _tmp
          rsync -a --exclude='.github' _tmp/kin/ ./
          rm -rf _tmp kin-source.zip
      - name: Commit extracted files
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Unzip source" || exit 0
          git push
