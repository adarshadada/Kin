name: unzip
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract any zip in the repo root
        run: |
          ls -la
          Z=$(ls *.zip | head -1)
          echo "Using $Z"
          python3 -m zipfile -e "$Z" _tmp
          D=$(dirname "$(find _tmp -name pubspec.yaml | head -1)")
          rm -rf "$D/.github"
          cp -a "$D"/. ./
          rm -rf _tmp "$Z"
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Unzip source"
          git push
